services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env               # TURSO_URL, TURSO_TOKEN, ALPACA_*, etc.
    environment:
      LOCAL_DB_PATH: /app/data/quantgene_local.db
    volumes:
      - ./data:/app/data         # persistent SQLite + parquet cache
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:80"                # access at http://localhost:3000
    depends_on:
      - backend
