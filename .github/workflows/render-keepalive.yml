name: Render Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tick all running instances
        run: |
          curl -s -X POST https://deepseek-stock-papertrade.onrender.com/tick \
            -H "Content-Type: application/json" \
            --max-time 30 \
            | jq '{ticked: .ticked, total: .total_instances, running: (.running_keys | length)}'
